---
layout: news_posts
title: News
permalink: /news/
---

<ul class="news-list">
  {% assign news_items = site.news | sort: "date" | reverse %}
  {% for item in news_items %}
    <li class="news-entry">
      <time>{{ item.date | date: "%B %d, %Y" }}</time>
      <a href="{{ item.url }}">{{ item.title }}</a>
    </li>
  {% endfor %}
</ul>
