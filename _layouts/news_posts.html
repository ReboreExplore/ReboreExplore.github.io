<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  {% include nav.html %}

  <main class="container page-content">
    <h1>{{ page.title }}</h1>
    <div class="news-content">
      {% if page.date %}<time>{{ page.date | date: "%B %d, %Y" }}</time>{% endif %}
      {{ content }}
    </div>

    {% if page.collection == "news" %}
      <a href="{{ '/news/' | relative_url }}" class="back-link">← Back to News</a>
    {% else %}
      <a href="{{ '/' | relative_url }}" class="back-link">← Back to Home</a>
    {% endif %}
  </main>

  {% include footer.html %}
</body>
</html>
