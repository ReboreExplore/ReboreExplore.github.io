<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  {% include nav.html %}

  <main class="blog-post">
    <h1>{{ page.title }}</h1>
    <p class="meta"><em>{{ page.date | date: "%B %d, %Y" }}</em></p>

    {% if page.image %}
      <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
    {% endif %}

    <div class="blog-post-body">
      {{ content }}
    </div>

    {% if page.tags %}
      <div class="tags">
        {% for tag in page.tags %}
          <span class="tag">{{ tag }}</span>
        {% endfor %}
      </div>
    {% endif %}

    <a href="{{ '/blog/' | relative_url }}" class="back-link">← Back to Blog</a>
  </main>

  {% include footer.html %}
</body>
</html>
