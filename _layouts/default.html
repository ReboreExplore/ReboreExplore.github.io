<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body>
  {% include nav.html %}

  <div class="container">
    {% if page.permalink == "/" %}
      <div class="hero">
        <img class="profile-img" src="{{ '/assets/images/prof_picture.png' | relative_url }}" alt="Photo of {{ site.First_name }} {{ site.last_name }}">
        <div class="text-section">
          {{ content }}
        </div>
      </div>
    {% else %}
      <div class="page-content">
        <h1>{{ page.title }}</h1>
        {{ content }}
      </div>
    {% endif %}
  </div>

  {% include footer.html %}
</body>
</html>
