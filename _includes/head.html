<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function () {
    var stored = localStorage.getItem('theme');
    if (stored) document.documentElement.setAttribute('data-theme', stored);
  })();
</script>
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.First_name }} {{ site.last_name }}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">
{% elsif site.description %}<meta name="description" content="{{ site.description }}">
{% endif %}

<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css" integrity="{{ site.fontawesome.integrity }}" crossorigin="anonymous" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/academicons@1.9.0/css/academicons.min.css" integrity="{{ site.academicons.integrity }}" crossorigin="anonymous" />
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>{{ site.icon }}</text></svg>">
